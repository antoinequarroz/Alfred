name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Serveur CalDAV de test (Radicale)
        run: |
          pip install --quiet radicale
          mkdir -p /tmp/radicale
          printf 'alfred:secret\n' > /tmp/radicale/users
          printf '[server]\nhosts = 127.0.0.1:5232\n[auth]\ntype = htpasswd\nhtpasswd_filename = /tmp/radicale/users\nhtpasswd_encryption = plain\n[storage]\nfilesystem_folder = /tmp/radicale/collections\n' > /tmp/radicale/config
          python3 -m radicale --config /tmp/radicale/config &
          sleep 2
      - run: npm test
        env:
          RADICALE_URL: http://127.0.0.1:5232
          RADICALE_USER: alfred
          RADICALE_PASSWORD: secret
      - run: npm run build
