# Alfred sur le VPS : l'app (~100 Mo de RAM, base SQLite dans un volume) et son serveur de visio (LiveKit).
# Lancer depuis la racine du dépôt : docker compose -f deploy/docker-compose.yml up -d --build
name: alfred
services:
  alfred:
    build: ..
    image: alfred:latest
    container_name: alfred
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - alfred-data:/data
    # Écoute seulement en local : c'est Caddy qui expose le service en HTTPS.
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - caddy
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  # Serveur de visio. La signalisation (7880) reste sur le réseau Docker : Caddy y envoie
  # alfred.antoinequarroz.ch/rtc. Seuls l'audio et la vidéo sont exposés : 7882/udp, et 7881/tcp en repli.
  # Limites strictes : la visio ne doit jamais gêner les autres sites du VPS.
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: alfred-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    # LIVEKIT_KEYS et NODE_IP, écrits par deploy/visio.sh (pas le .env d'Alfred : ses secrets ne regardent pas LiveKit).
    # Facultatif pour que « docker compose up » d'Alfred ne soit jamais bloqué : sans ce fichier, seul
    # ce conteneur ne démarre pas (pas de clés), Alfred tourne et annonce la visio comme non installée.
    env_file:
      - path: ../.env.livekit
        required: false
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    networks:
      - caddy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  alfred-data:

networks:
  # Réseau Docker du conteneur Caddy existant, pour qu'il puisse joindre « alfred:3200 ».
  caddy:
    external: true
    name: ${CADDY_NETWORK:-antoinequarroz-vitrine_appnet}
