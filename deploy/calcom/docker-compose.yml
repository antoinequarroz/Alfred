# Alfred — Phase 1 : prise de RDV (Cal.com) synchronisée avec iCloud
#
# Pensé pour un VPS déjà chargé (2 vCPU / 3,8 Go RAM partagés avec d'autres sites) :
#   - limites mémoire strictes : si Cal.com déborde, c'est lui qui redémarre, pas tes autres services
#   - pas de swap autorisé pour ces conteneurs (memswap_limit = mem_limit)
#   - aucun port public : Cal.com n'écoute que sur 127.0.0.1, Caddy fait le HTTPS
#   - réseau Docker dédié, aucun service existant n'est touché
#
# Usage : cp .env.example .env && (remplir .env) && docker compose up -d
# Doc complète : docs/PHASE1-INSTALL.md

name: alfred-calcom

services:
  calcom-db:
    image: postgres:16-alpine
    container_name: alfred-calcom-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-calcom}
    # Réglages "petit serveur" : un seul utilisateur, quelques dizaines de RDV par mois
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=20
    volumes:
      - calcom-db-data:/var/lib/postgresql/data
    networks:
      - calcom
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calcom} -d ${POSTGRES_DB:-calcom}"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  calcom:
    # Version figée : on monte de version volontairement, après sauvegarde (voir la doc)
    image: calcom/cal.com:${CALCOM_VERSION:-v6.2.0}
    container_name: alfred-calcom
    restart: unless-stopped
    depends_on:
      calcom-db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_HOST: calcom-db:5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-calcom}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB:-calcom}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER:-calcom}:${POSTGRES_PASSWORD}@calcom-db:5432/${POSTGRES_DB:-calcom}
      NEXTAUTH_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBAPP_URL}
      NEXT_PUBLIC_EMBED_LIB_URL: ${NEXT_PUBLIC_WEBAPP_URL}/embed/embed.js
      CALCOM_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      # Plafonne le tas Node pour rester sous la limite du conteneur
      NODE_OPTIONS: --max-old-space-size=${CALCOM_NODE_HEAP_MB:-640}
    ports:
      # Uniquement en local : Caddy (sur l'hôte) fait le reverse proxy HTTPS
      - "127.0.0.1:${CALCOM_PORT:-3100}:3000"
    networks:
      - calcom
    mem_limit: ${CALCOM_MEM_LIMIT:-1g}
    memswap_limit: ${CALCOM_MEM_LIMIT:-1g}
    cpus: 1.0
    logging: *logging

networks:
  calcom:
    name: alfred-calcom

volumes:
  calcom-db-data:
    name: alfred-calcom-db-data
